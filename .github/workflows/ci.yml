name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Auth-BE.sln -c Release
      - run: dotnet test Auth.Tests -c Release --no-build
      # The deploy builds this image; a Dockerfile that stops building means Railway
      # silently keeps serving the previous version.
      - run: docker build -t scholar-api-ci .
